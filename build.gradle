plugins {
    id 'java-library'
    id 'maven-publish'
}

group = providers.gradleProperty('flterraforged_engine_group').get()
version = providers.gradleProperty('flterraforged_engine_version').get()

def engineApiVersion = providers.gradleProperty('flterraforged_engine_api_version').get()

def configuredLocalRepository = providers
        .gradleProperty('flterraforged_api_local_repository')
        .orElse(providers.environmentVariable('FLTERRAFORGED_API_LOCAL_REPOSITORY'))
        .getOrNull()

def remoteRepositoryUrl = providers
        .gradleProperty('flterraforged_api_repository_url')
        .orElse(providers.environmentVariable('FLTERRAFORGED_API_REPOSITORY_URL'))
        .orElse('https://raw.githubusercontent.com/jborkenhagen74/FlTerraForged/maven/')
        .get()

base {
    archivesName = 'flterraforged-engine'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.addBooleanOption('Werror', true)
}

repositories {
    // 1) Explicit local build repository, useful when FlTerraForged and the
    // engine are developed together but remain separate repositories.
    if (configuredLocalRepository != null && !configuredLocalRepository.isBlank()) {
        maven {
            name = 'flTerraForgedLocalBuild'
            url = uri(configuredLocalRepository)
        }
    } else {
        // FEF-style convenience: if the sibling repository has already
        // published :engine-api locally, consume it automatically.
        File siblingRepository = file('../FlTerraForged/build/maven-repository')
        if (siblingRepository.isDirectory()) {
            maven {
                name = 'flTerraForgedSiblingBuild'
                url = siblingRepository.toURI()
            }
        }
    }

    // 2) Developer-local Maven cache.
    mavenLocal()

    // 3) Normal public dependencies.
    mavenCentral()

    // 4) Public FlTerraForged API repository. No credentials are required
    // while the GitHub repository is public.
    if (remoteRepositoryUrl != null && !remoteRepositoryUrl.isBlank()) {
        maven {
            name = 'flTerraForgedApi'
            url = uri(remoteRepositoryUrl)
            content {
                includeModule 'dev.foucaultleon', 'flterraforged-engine-api'
            }
        }
    }
}

dependencies {
    api("dev.foucaultleon:flterraforged-engine-api:${engineApiVersion}") {
        changing = engineApiVersion.endsWith('-SNAPSHOT')
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

configurations.configureEach {
    if (engineApiVersion.endsWith('-SNAPSHOT')) {
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
    }
}

tasks.register('verifyEngineIsolation') {
    group = 'verification'
    description = 'Rejects Minecraft, loader, TerraBlender and Conquest dependencies in the engine.'

    doLast {
        def banned = [
                'net.minecraft.',
                'net.fabricmc.',
                'net.neoforged.',
                'net.minecraftforge.',
                'com.mojang.serialization.',
                'terrablender',
                'conquest'
        ]
        fileTree('src/main/java') { include '**/*.java' }.each { source ->
            def text = source.getText('UTF-8').toLowerCase(Locale.ROOT)
            banned.each { token ->
                if (text.contains(token.toLowerCase(Locale.ROOT))) {
                    throw new GradleException("Forbidden engine dependency '${token}' in ${source}")
                }
            }
        }
    }
}

tasks.register('verifyServiceProvider') {
    group = 'verification'
    description = 'Checks the ServiceLoader descriptor for the default engine provider.'
    doLast {
        def descriptor = file('src/main/resources/META-INF/services/dev.foucaultleon.flterraforged.engine.api.EngineProvider')
        if (!descriptor.isFile()) {
            throw new GradleException('Missing EngineProvider service descriptor')
        }
        def expected = 'dev.foucaultleon.flterraforged.engine.DefaultEngineProvider'
        if (descriptor.getText('UTF-8').trim() != expected) {
            throw new GradleException('Unexpected EngineProvider descriptor content')
        }
    }
}

tasks.named('check') {
    dependsOn 'verifyEngineIsolation'
    dependsOn 'verifyServiceProvider'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'flterraforged-engine'

            pom {
                name = 'FlTerraForged Engine'
                description = 'Default external terrain engine implementation for FlTerraForged.'
                url = 'https://github.com/jborkenhagen74/FlTerraForged-Engine'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/license/mit'
                    }
                }

                scm {
                    url = 'https://github.com/jborkenhagen74/FlTerraForged-Engine'
                    connection = 'scm:git:https://github.com/jborkenhagen74/FlTerraForged-Engine.git'
                    developerConnection = 'scm:git:ssh://git@github.com/jborkenhagen74/FlTerraForged-Engine.git'
                }
            }
        }
    }

    // The engine itself uses the same FEF-style repository model. CI mirrors
    // this directory to this repository's public `maven` branch.
    repositories {
        maven {
            name = 'buildRepository'
            url = rootProject.layout.buildDirectory.dir('maven-repository')
        }
    }
}
