plugins {
    id 'java-library'
    id 'maven-publish'
}

group = providers.gradleProperty('flterraforged_engine_group').get()
version = providers.gradleProperty('flterraforged_engine_version').get()

def engineApiVersion = providers.gradleProperty('flterraforged_engine_api_version').get()
def useMavenLocal = providers.gradleProperty('flterraforged_use_maven_local')
        .map { it.toBoolean() }
        .orElse(false)
        .get()

base {
    archivesName = 'flterraforged-engine'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

repositories {
    if (useMavenLocal) {
        mavenLocal()
    }

    mavenCentral()

    maven {
        name = 'FlTerraForgedGitHubPackages'
        url = uri(providers.gradleProperty('flterraforged_api_repository_url')
                .orElse(providers.environmentVariable('FLTERRAFORGED_API_REPOSITORY_URL'))
                .orElse('https://maven.pkg.github.com/jborkenhagen74/FlTerraForged')
                .get())
        credentials {
            username = providers.gradleProperty('gpr.user')
                    .orElse(providers.environmentVariable('FLTERRAFORGED_PACKAGES_USER'))
                    .orElse(providers.environmentVariable('GITHUB_ACTOR'))
                    .getOrNull()
            password = providers.gradleProperty('gpr.key')
                    .orElse(providers.environmentVariable('FLTERRAFORGED_PACKAGES_TOKEN'))
                    .orElse(providers.environmentVariable('GITHUB_TOKEN'))
                    .getOrNull()
        }
        content {
            includeGroup 'dev.foucaultleon'
        }
    }
}

dependencies {
    api("dev.foucaultleon:flterraforged-engine-api:${engineApiVersion}") {
        changing = engineApiVersion.endsWith('-SNAPSHOT')
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

configurations.configureEach {
    if (engineApiVersion.endsWith('-SNAPSHOT')) {
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
    }
}

tasks.register('verifyEngineIsolation') {
    group = 'verification'
    description = 'Rejects Minecraft, loader, TerraBlender and Conquest dependencies in the engine.'

    doLast {
        def banned = [
                'net.minecraft.',
                'net.fabricmc.',
                'net.neoforged.',
                'net.minecraftforge.',
                'com.mojang.serialization.',
                'terrablender',
                'conquest'
        ]
        fileTree('src/main/java') { include '**/*.java' }.each { source ->
            def text = source.getText('UTF-8').toLowerCase(Locale.ROOT)
            banned.each { token ->
                if (text.contains(token.toLowerCase(Locale.ROOT))) {
                    throw new GradleException("Forbidden engine dependency '${token}' in ${source}")
                }
            }
        }
    }
}

tasks.register('verifyServiceProvider') {
    group = 'verification'
    description = 'Checks the ServiceLoader descriptor for the default engine provider.'
    doLast {
        def descriptor = file('src/main/resources/META-INF/services/dev.foucaultleon.flterraforged.engine.api.EngineProvider')
        if (!descriptor.isFile()) {
            throw new GradleException('Missing EngineProvider service descriptor')
        }
        def expected = 'dev.foucaultleon.flterraforged.engine.DefaultEngineProvider'
        if (descriptor.getText('UTF-8').trim() != expected) {
            throw new GradleException('Unexpected EngineProvider descriptor content')
        }
    }
}

tasks.named('check') {
    dependsOn 'verifyEngineIsolation'
    dependsOn 'verifyServiceProvider'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'flterraforged-engine'

            pom {
                name = 'FlTerraForged Engine'
                description = 'Default external terrain engine implementation for FlTerraForged.'
                url = 'https://github.com/jborkenhagen74/FlTerraForged-Engine'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/license/mit'
                    }
                }

                scm {
                    url = 'https://github.com/jborkenhagen74/FlTerraForged-Engine'
                    connection = 'scm:git:https://github.com/jborkenhagen74/FlTerraForged-Engine.git'
                    developerConnection = 'scm:git:ssh://git@github.com/jborkenhagen74/FlTerraForged-Engine.git'
                }
            }
        }
    }

    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/jborkenhagen74/FlTerraForged-Engine')
            credentials {
                username = providers.gradleProperty('gpr.user')
                        .orElse(providers.environmentVariable('GITHUB_ACTOR'))
                        .getOrNull()
                password = providers.gradleProperty('gpr.key')
                        .orElse(providers.environmentVariable('GITHUB_TOKEN'))
                        .getOrNull()
            }
        }
    }
}
