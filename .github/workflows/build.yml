name: Build R43

on:
  push:
    branches: [ 'revision/r43-water-body-semantics' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check R43 water-body semantics against R53 API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Engine R43
        uses: actions/checkout@v6

      - name: Install Java 17 toolchain
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Remember Java 17 toolchain
        run: echo "FLTERRAFORGED_JAVA17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Java 21 build runtime
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Verify inherited R41 startup liveness
        run: python3 tools/verify-r41-startup-liveness.py

      - name: Verify inherited R42 resolved water field
        run: python3 tools/verify-r42-resolved-water-field.py

      - name: Verify R43 confined water-body semantics
        run: python3 tools/verify-r43-water-body-semantics.py

      - name: Checkout R53 host API source
        uses: actions/checkout@v6
        with:
          repository: jborkenhagen74/FlTerraForged
          ref: revision/r53-open-water-confinement
          path: .ci/flterraforged-r53

      - name: Build R53 Engine API local repository
        run: gradle -p .ci/flterraforged-r53 -Dorg.gradle.java.installations.paths="$FLTERRAFORGED_JAVA17_HOME,$JAVA_HOME" --no-daemon --warning-mode all :engine-api:publish

      - name: Build and test R43 against R53 Engine API
        env:
          FLTERRAFORGED_API_LOCAL_REPOSITORY: ${{ github.workspace }}/.ci/flterraforged-r53/build/maven-repository
        run: gradle -Dorg.gradle.java.installations.paths="$FLTERRAFORGED_JAVA17_HOME,$JAVA_HOME" --no-daemon --refresh-dependencies --warning-mode all clean check jar

      - name: Collect R43 runtime JAR
        id: collect_engine_r43
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(
            find build/libs -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              -print | sort
          )
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::Expected one Engine runtime JAR, found ${#jars[@]}."
            exit 1
          fi
          short_sha="${GITHUB_SHA:0:7}"
          mkdir -p build/artifacts
          path="build/artifacts/FlTerraForged-Engine-R43-${short_sha}.jar"
          cp "${jars[0]}" "$path"
          echo "artifact_path=$path" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename "$path")" >> "$GITHUB_OUTPUT"

      - name: Upload R43 runtime JAR
        id: upload_engine_r43
        uses: actions/upload-artifact@v7.0.1
        with:
          name: FlTerraForged-Engine-R43
          path: ${{ steps.collect_engine_r43.outputs.artifact_path }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Add R43 artifact link to job summary
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload_engine_r43.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload_engine_r43.outputs.artifact-digest }}
          JAR_NAME: ${{ steps.collect_engine_r43.outputs.jar_name }}
        run: |
          {
            echo "### FlTerraForged Engine R43"
            echo
            echo "- JAR: \`$JAR_NAME\`"
            echo "- Host API validation: FlTerraForged R53"
            echo "- Hydraulic authority: one resolved water field retained"
            echo "- River mouths: confined river ownership through marginal coast; ocean hand-off only at strong ocean thresholds"
            echo "- Lake outlets: shore-only lake promotion cannot replace a material river"
            echo "- Placement environment cache: bounded sparse inline single-flight"
            echo "- Final order: river -> wet-core/main-stem -> resolved water field -> climate/classification"
            echo "- R41 bounded inline single-flight final-sample caches: retained"
            echo "- Worldgen executor scheduling from cache loaders: none"
            echo "- Post-generation repair pass: none"
            echo "- SHA-256: \`$ARTIFACT_DIGEST\`"
            echo "- [Download artifact]($ARTIFACT_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
