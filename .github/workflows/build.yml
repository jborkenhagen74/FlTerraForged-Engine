name: Build R38

on:
  push:
    branches: [ 'revision/r38-water-authority-riparian' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check R38 against R47 API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Engine R38
        uses: actions/checkout@v6

      - name: Install Java 17 toolchain
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Remember Java 17 toolchain
        run: echo "FLTERRAFORGED_JAVA17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Java 21 build runtime
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Verify Engine R38 receiving-water authority
        run: python3 tools/verify-r38-water-authority.py

      - name: Checkout R47 host API source
        uses: actions/checkout@v6
        with:
          repository: jborkenhagen74/FlTerraForged
          ref: revision/r47-hydraulic-shores
          path: .ci/flterraforged-r47

      - name: Build R47 Engine API local repository
        run: gradle -p .ci/flterraforged-r47 -Dorg.gradle.java.installations.paths="$FLTERRAFORGED_JAVA17_HOME,$JAVA_HOME" --no-daemon --warning-mode all :engine-api:publish

      - name: Build and test R38 against R47 Engine API
        env:
          FLTERRAFORGED_API_LOCAL_REPOSITORY: ${{ github.workspace }}/.ci/flterraforged-r47/build/maven-repository
        run: gradle -Dorg.gradle.java.installations.paths="$FLTERRAFORGED_JAVA17_HOME,$JAVA_HOME" --no-daemon --refresh-dependencies --warning-mode all clean check jar

      - name: Collect R38 runtime JAR
        id: collect_engine_r38
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(
            find build/libs -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              -print | sort
          )
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::Expected one Engine runtime JAR, found ${#jars[@]}."
            exit 1
          fi
          short_sha="${GITHUB_SHA:0:7}"
          mkdir -p build/artifacts
          path="build/artifacts/FlTerraForged-Engine-R38-${short_sha}.jar"
          cp "${jars[0]}" "$path"
          echo "artifact_path=$path" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename "$path")" >> "$GITHUB_OUTPUT"

      - name: Upload R38 runtime JAR
        id: upload_engine_r38
        uses: actions/upload-artifact@v7.0.1
        with:
          name: FlTerraForged-Engine-R38
          path: ${{ steps.collect_engine_r38.outputs.artifact_path }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Add R38 artifact link to job summary
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload_engine_r38.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload_engine_r38.outputs.artifact-digest }}
          JAR_NAME: ${{ steps.collect_engine_r38.outputs.jar_name }}
        run: |
          {
            echo "### FlTerraForged Engine R38"
            echo
            echo "- JAR: \`$JAR_NAME\`"
            echo "- Host API validation: FlTerraForged R47"
            echo "- Receiving water authority: ocean/lake over incoming river"
            echo "- Waterfall preservation: enabled"
            echo "- SHA-256: \`$ARTIFACT_DIGEST\`"
            echo "- [Download artifact]($ARTIFACT_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
