name: Build

on:
  push:
    branches: [ develop, main, 'revision/**' ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Verify layout
        run: python3 tools/verify-layout.py

      - name: Build and test against public Engine API Maven repository
        run: gradle --no-daemon --refresh-dependencies clean check

  publish-engine-snapshot:
    name: Publish Engine Snapshot
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Build Maven repository
        run: gradle --no-daemon --refresh-dependencies publish

      - name: Publish Maven repository branch
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: maven
          publish_dir: ./build/maven-repository
          keep_files: true
          force_orphan: false
          commit_message: "Publish Engine ${{ github.sha }}"
