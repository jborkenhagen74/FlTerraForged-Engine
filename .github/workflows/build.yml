name: Build R39

on:
  push:
    branches: [ 'revision/r39-receiver-continuity' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check R39 against R49 API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Engine R39
        uses: actions/checkout@v6

      - name: Install Java 17 toolchain
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Remember Java 17 toolchain
        run: echo "FLTERRAFORGED_JAVA17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Java 21 build runtime
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Verify Engine R39 receiver continuity
        run: python3 tools/verify-r39-receiver-continuity.py

      - name: Checkout R49 host API source
        uses: actions/checkout@v6
        with:
          repository: jborkenhagen74/FlTerraForged
          ref: revision/r49-hydraulic-quantization
          path: .ci/flterraforged-r49

      - name: Build R49 Engine API local repository
        run: gradle -p .ci/flterraforged-r49 -Dorg.gradle.java.installations.paths="$FLTERRAFORGED_JAVA17_HOME,$JAVA_HOME" --no-daemon --warning-mode all :engine-api:publish

      - name: Build and test R39 against R49 Engine API
        env:
          FLTERRAFORGED_API_LOCAL_REPOSITORY: ${{ github.workspace }}/.ci/flterraforged-r49/build/maven-repository
        run: gradle -Dorg.gradle.java.installations.paths="$FLTERRAFORGED_JAVA17_HOME,$JAVA_HOME" --no-daemon --refresh-dependencies --warning-mode all clean check jar

      - name: Collect R39 runtime JAR
        id: collect_engine_r39
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(
            find build/libs -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              -print | sort
          )
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::Expected one Engine runtime JAR, found ${#jars[@]}."
            exit 1
          fi
          short_sha="${GITHUB_SHA:0:7}"
          mkdir -p build/artifacts
          path="build/artifacts/FlTerraForged-Engine-R39-${short_sha}.jar"
          cp "${jars[0]}" "$path"
          echo "artifact_path=$path" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename "$path")" >> "$GITHUB_OUTPUT"

      - name: Upload R39 runtime JAR
        id: upload_engine_r39
        uses: actions/upload-artifact@v7.0.1
        with:
          name: FlTerraForged-Engine-R39
          path: ${{ steps.collect_engine_r39.outputs.artifact_path }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Add R39 artifact link to job summary
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload_engine_r39.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload_engine_r39.outputs.artifact-digest }}
          JAR_NAME: ${{ steps.collect_engine_r39.outputs.jar_name }}
        run: |
          {
            echo "### FlTerraForged Engine R39"
            echo
            echo "- JAR: \`$JAR_NAME\`"
            echo "- Host API validation: FlTerraForged R49"
            echo "- Receiving water authority: ocean/lake over incoming river"
            echo "- Narrow lake wet-core bridge continuity: enabled"
            echo "- Lake receiver probes: cached lake-only lookup"
            echo "- Waterfall preservation: enabled"
            echo "- SHA-256: \`$ARTIFACT_DIGEST\`"
            echo "- [Download artifact]($ARTIFACT_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
