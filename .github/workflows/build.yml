name: Build R40

on:
  push:
    branches: [ 'revision/r40-receiver-overlay' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check R40 against R50 API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Engine R40
        uses: actions/checkout@v6

      - name: Install Java 17 toolchain
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Remember Java 17 toolchain
        run: echo "FLTERRAFORGED_JAVA17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Java 21 build runtime
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Verify Engine R40 receiver overlay
        run: python3 tools/verify-r40-receiver-overlay.py

      - name: Checkout R50 host API source
        uses: actions/checkout@v6
        with:
          repository: jborkenhagen74/FlTerraForged
          ref: revision/r50-receiver-overlay
          path: .ci/flterraforged-r50

      - name: Build R50 Engine API local repository
        run: gradle -p .ci/flterraforged-r50 -Dorg.gradle.java.installations.paths="$FLTERRAFORGED_JAVA17_HOME,$JAVA_HOME" --no-daemon --warning-mode all :engine-api:publish

      - name: Build and test R40 against R50 Engine API
        env:
          FLTERRAFORGED_API_LOCAL_REPOSITORY: ${{ github.workspace }}/.ci/flterraforged-r50/build/maven-repository
        run: gradle -Dorg.gradle.java.installations.paths="$FLTERRAFORGED_JAVA17_HOME,$JAVA_HOME" --no-daemon --refresh-dependencies --warning-mode all clean check jar

      - name: Collect R40 runtime JAR
        id: collect_engine_r40
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(
            find build/libs -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              -print | sort
          )
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::Expected one Engine runtime JAR, found ${#jars[@]}."
            exit 1
          fi
          short_sha="${GITHUB_SHA:0:7}"
          mkdir -p build/artifacts
          path="build/artifacts/FlTerraForged-Engine-R40-${short_sha}.jar"
          cp "${jars[0]}" "$path"
          echo "artifact_path=$path" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename "$path")" >> "$GITHUB_OUTPUT"

      - name: Upload R40 runtime JAR
        id: upload_engine_r40
        uses: actions/upload-artifact@v7.0.1
        with:
          name: FlTerraForged-Engine-R40
          path: ${{ steps.collect_engine_r40.outputs.artifact_path }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Add R40 artifact link to job summary
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload_engine_r40.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload_engine_r40.outputs.artifact-digest }}
          JAR_NAME: ${{ steps.collect_engine_r40.outputs.jar_name }}
        run: |
          {
            echo "### FlTerraForged Engine R40"
            echo
            echo "- JAR: \`$JAR_NAME\`"
            echo "- Host API validation: FlTerraForged R50"
            echo "- Drainage topology source: post-erosion terrain"
            echo "- Final order: river -> wet-core -> receiver overlay"
            echo "- Open ocean restores natural post-erosion bed"
            echo "- Lakes re-apply receiver-owned bed and level after river shaping"
            echo "- Receiver mouth alignment never deepens an existing river bed"
            echo "- Duplicate post-erosion resampling in overlay: none"
            echo "- Post-generation repair pass: none"
            echo "- SHA-256: \`$ARTIFACT_DIGEST\`"
            echo "- [Download artifact]($ARTIFACT_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
