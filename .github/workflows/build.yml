name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          path: FlTerraForged-Engine

      - name: Checkout FlTerraForged API
        uses: actions/checkout@v4
        with:
          repository: jborkenhagen74/FlTerraForged
          path: FlTerraForged

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Verify layout
        working-directory: FlTerraForged-Engine
        run: python3 tools/verify-layout.py

      - name: Build and test
        working-directory: FlTerraForged-Engine
        env:
          FLTERRAFORGED_API_PROJECT_DIR: ../FlTerraForged
        run: gradle --no-daemon check
