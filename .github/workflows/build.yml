name: Build

on:
  push:
    branches: [ develop, main, 'revision/**' ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Verify layout
        run: python3 tools/verify-layout.py

      - name: Build, test and create runtime JAR against public Engine API Maven repository
        run: gradle --no-daemon --refresh-dependencies clean check jar

      - name: Collect Engine JAR
        id: collect_engine
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t jars < <(
            find build/libs -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              -print | sort
          )

          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Engine runtime JAR in build/libs, found ${#jars[@]}."
            if [ "${#jars[@]}" -gt 0 ]; then
              printf 'Candidate: %s\n' "${jars[@]}"
            fi
            exit 1
          fi

          mkdir -p build/artifacts
          short_sha="${GITHUB_SHA:0:7}"
          artifact_path="build/artifacts/FlTerraForged-Engine-R32-${short_sha}.jar"
          cp "${jars[0]}" "$artifact_path"

          echo "artifact_path=$artifact_path" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename "$artifact_path")" >> "$GITHUB_OUTPUT"

      - name: Upload Engine JAR
        id: upload_engine
        uses: actions/upload-artifact@v7.0.1
        with:
          path: ${{ steps.collect_engine.outputs.artifact_path }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Add Engine artifact link to job summary
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload_engine.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload_engine.outputs.artifact-digest }}
          JAR_NAME: ${{ steps.collect_engine.outputs.jar_name }}
        run: |
          {
            echo "### FlTerraForged Engine R32 artifact"
            echo
            echo "- JAR: \`$JAR_NAME\`"
            echo "- SHA-256: \`$ARTIFACT_DIGEST\`"
            echo "- [Download artifact]($ARTIFACT_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-engine-snapshot:
    name: Publish Engine Snapshot
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Build Maven repository
        run: gradle --no-daemon --refresh-dependencies publish

      - name: Publish Maven repository branch
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: maven
          publish_dir: ./build/maven-repository
          keep_files: true
          force_orphan: false
          commit_message: "Publish Engine ${{ github.sha }}"
